ng:16px;flex-wrap:wrap}.log-table th,.log-table td{padding:12px 14px}.desktop-only{display:none}.mobile-only{display:block}}

.branch-open{display:block;width:100%;text-align:left;color:var(--ink);font:inherit;cursor:pointer}.branch-open:hover{border-color:var(--brand);background:var(--soft)}.branch-open strong{display:block;font-size:17px}.branch-open small{display:block;color:var(--brand);margin-top:12px}.store-link{border:0;background:none;padding:0;color:var(--brand);text-decoration:underline;text-underline-offset:3px;min-height:30px;text-align:left}.log-pagination{flex-wrap:wrap}.log-pagination .btn{min-width:40px;min-height:40px}.log-pages{display:flex;gap:5px;flex-wrap:wrap}.log-pages [aria-current="page"]{background:var(--brand);color:#fff;border-color:var(--brand)}.log-size{display:flex;align-items:center;gap:8px;font-size:12px;margin:0;font-weight:400}.log-size select{width:auto;min-height:40px;padding:6px 24px 6px 10px}.log-dialog{width:min(1020px,calc(100% - 32px));max-width:none;max-height:86vh;border:1px solid var(--line);border-radius:18px;padding:0;color:var(--ink);background:#fff;box-shadow:0 20px 80px #242b3b40}.log-dialog::backdrop{background:#18213599}.dialog-header{display:flex;justify-content:space-between;align-items:start;gap:18px;padding:23px 26px;border-bottom:1px solid var(--line)}.dialog-header p{margin-top:7px;font-size:13px;color:var(--muted)}.dialog-content{overflow:auto}.dialog-content .table-panel{border:0;border-radius:0}.dialog-header .btn{flex-shrink:0}.log-error{padding:20px}.log-error p{margin-bottom:14px;color:#923a2a;overflow-wrap:anywhere}@media(max-width:700px){.log-dialog{width:calc(100% - 20px);max-height:90vh;border-radius:14px}.dialog-header{padding:18px 16px}.dialog-header h2{font-size:21px}.dialog-header .btn{padding:8px 12px}.log-pages{width:100%}.branch-open strong{font-size:14px}.branch-open small{font-size:11px}}

</style></head><body>
<div id="demoBanner" class="demo-banner hidden">Test modu • Gönderimler Sheets’e kaydedilmez.</div>
<header class="header"><a class="brand" href="#" id="brandLink"><span class="mark">hedef<span style="font-weight:400">avm</span></span><small>Müşteri deneyimi<br>Değerlendirme formu</small></a></header>
<main class="wrap" id="app"></main><footer class="footer">Hedef Alışveriş Merkezleri · Görüşlerinizle daha iyiye.</footer>
<script>

'use strict';
const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbwh_n0IEUH1B3Wd_d9kPu9aFz2zGzLWZU7FcSf5rn53DcYtLTqonCnF-MBdjTDVkVpu/exec';
const STORES=['Kavacık','Paşabahçe','Çekmeköy','Yenidoğan','Sultanbeyli','Çayırova','Gebze','Körfez','Derince','İzmit','Gölcük','İnegöl','Düzce'];
const CHANNELS=['Mağazanızı yoldan geçerken fark ettim','Bir tanıdığımın önerisiyle geldim','hedefavm.com veya sosyal medya sayesinde','Daha önce de alışveriş yapmıştım, memnun kaldığım için tekrar geldim'];
const demo=new URLSearchParams(location.search).has('demo');let token='',user=null;const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function rpc(fn,...args){
 if(demo)return demoRpc(fn,...args);
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),60000);
 try{
  const response=await fetch(APPS_SCRIPT_URL,{method:'POST',mode:'cors',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:fn,args}),signal:controller.signal});
  if(!response.ok)throw Error('Sunucuya ulaşılamadı (HTTP '+response.status+'). Apps Script erişimini kontrol edin.');
  let payload;try{payload=await response.json();}catch{throw Error('Sunucu JSON yanıtı vermedi. Güncel Code.gs dosyasını yeni sürüm olarak dağıtın; erişimi Herkes yapın.');}
  if(!payload||typeof payload.ok!=='boolean')throw Error('API yanıtı geçersiz. Güncel Code.gs sürümünü dağıtın.');
  if(!payload.ok)throw Error(payload.error||'İşlem tamamlanamadı.');
  return payload.data;
 }catch(error){
  if(error.name==='AbortError')throw Error('Sunucu yanıtı zaman aşımına uğradı. Gönderim yapılmış olabilir; tekrar denerseniz aynı kayıt kimliği kullanılır.');
  if(error instanceof TypeError)throw Error('Backend bağlantısı kurulamadı. İnternet bağlantısını ve Apps Script dağıtımının Herkes erişimine açık olduğunu kontrol edin.');
  throw error;
 }finally{clearTimeout(timeout);}
}
function message(text){const el=document.getElementById('status');if(el){el.textContent=text;el.scrollIntoView({block:'nearest',behavior:'smooth'});}}
function buttonBusy(form,on){form.querySelectorAll('button[type="submit"]').forEach(b=>{b.disabled=on;b.textContent=on?'İşleniyor…':b.dataset.label;});}
function options(values,selected=''){return values.map(v=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(v)}</option>`).join('');}
function header(){}
function survey(){user=null;token='';header();const requestId=window.crypto?.randomUUID?.()||'review-'+Date.now()+'-'+Math.random().toString(36).slice(2);app.innerHTML=`<div class="survey-layout"><aside class="intro"><div class="eyebrow"><span class="dot"></span>Her görüş, daha iyi bir deneyim.</div><h1>Alışverişiniz nasıldı?</h1><p>Hedef AVM’deki deneyiminizi merak ediyoruz. Görüşlerinizi bizimle paylaşır mısınız?</p><div class="intro-note"><h3>Sizi dinliyoruz.</h3><p>Değerlendirmeniz hizmetimizi geliştirmemize yardımcı olur. Yorumunuz yalnızca yetkili yönetim ekibine iletilir.</p><p style="margin-top:15px">◷ Yaklaşık 1 dakika</p></div></aside><section class="panel" id="formPanel"><div class="form-heading"><h2>Deneyiminizi paylaşın</h2><p><span class="required">*</span> İşaretli alanlar zorunludur.</p></div><form id="reviewForm"><div class="field"><label for="name">İsim soyisim <span class="required">*</span></label><input id="name" name="name" autocomplete="name" placeholder="Siparişinizdeki isim ve soyisim" minlength="3" maxlength="120" required></div><div class="field"><label for="store">Hizmet aldığınız mağaza <span class="required">*</span></label><select id="store" name="store" required><option value="">Mağazanızı seçin</option>${options(STORES)}</select></div><fieldset class="field" style="border:0;padding:0;margin-left:0;margin-right:0"><legend class="field-title">Hedef AVM’yi yakınlarınıza ne derece tavsiye edersiniz? <span class="required">*</span></legend><div class="scores">${Array.from({length:11},(_,i)=>`<div class="score"><label><input type="radio" name="score" value="${i}" required aria-label="${i} puan"><span>${i}</span></label></div>`).join('')}</div><div class="score-ends"><span>0 · Kesinlikle tavsiye etmem</span><span>10 · Kesinlikle tavsiye ederim</span></div></fieldset><div class="field"><label for="comment">Bu puanı vermenizin nedeni nedir?</label><textarea id="comment" name="comment" placeholder="Deneyiminizle ilgili paylaşmak istedikleriniz…" maxlength="3000"></textarea><p class="help">İsteğe bağlı · Yorumunuz mağaza panelinde gösterilmez.</p></div><fieldset class="field" style="border:0;padding:0;margin-left:0;margin-right:0"><legend class="field-title">Bu alışverişinizde markamıza nasıl ulaştınız? <span class="required">*</span></legend><div class="choices">${CHANNELS.map(c=>`<label class="choice"><input type="radio" name="channel" value="${esc(c)}" required><span>${esc(c)}</span></label>`).join('')}</div></fieldset><div class="trap" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div><p class="help" style="margin-bottom:15px">İsim soyisim, tarih ve puanınız ilgili mağazayla; tüm yanıtlarınız yetkili yönetimle paylaşılır.</p><div id="status" class="status" role="alert"></div><button class="btn full" type="submit" data-label="Değerlendirmeyi gönder">Değerlendirmeyi gönder</button></form></section></div>`;document.getElementById('reviewForm').onsubmit=async e=>{e.preventDefault();const f=e.target,values=Object.fromEntries(new FormData(f));values.score=Number(values.score);values.requestId=requestId;buttonBusy(f,true);try{await rpc('submitReview',values);document.getElementById('formPanel').innerHTML=`<div class="success"><div class="success-icon">✓</div><h2>Görüşünüz bize ulaştı.</h2><p class="muted">Zaman ayırdığınız için teşekkür ederiz. Her değerlendirme, daha iyi hizmet sunmamıza yardımcı oluyor.</p><button class="btn secondary" id="again">Yeni değerlendirme</button></div>`;document.getElementById('again').onclick=survey;}catch(err){message(err.message);buttonBusy(f,false);}};}
function demoRpc(fn){return fn==='submitReview'?Promise.resolve({success:true}):Promise.reject(Error('Form sayfasında bu işlem desteklenmez.'));}
document.getElementById('brandLink').onclick=e=>{e.preventDefault();survey();};
if(demo)document.getElementById('demoBanner').classList.remove('hidden');survey();
</script></body></html>
